<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Separate evidence questions</title><desc id="desc">Availability, retrieval, interpretation, observed behavior, and host enforcement are separate. None is established by a model simply saying it read the document.</desc><rect width="1200" height="700" rx="24" fill="#f5f7fa"/><text x="38" y="48" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#142d3d" font-weight="700">Five different evidence questions</text><text x="38" y="84" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#142d3d" font-weight="400">A successful check in one row does not establish the others.</text><rect x="38" y="117" width="1124" height="96" rx="14" fill="white" stroke="#c6d5dd"/><text x="60" y="155" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#166d75" font-weight="700">01</text><text x="114" y="156" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#142d3d" font-weight="700">Available</text><text x="395" y="152" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#142d3d" font-weight="400">Is the right file stored or attached?</text><text x="395" y="186" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435b69" font-weight="400">A file listing does not prove the model used it.</text><rect x="38" y="229" width="1124" height="96" rx="14" fill="white" stroke="#c6d5dd"/><text x="60" y="267" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#166d75" font-weight="700">02</text><text x="114" y="268" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#142d3d" font-weight="700">Retrieved now</text><text x="395" y="264" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#142d3d" font-weight="400">Did relevant text reach this session?</text><text x="395" y="298" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435b69" font-weight="400">A quotation may show only a small part.</text><rect x="38" y="341" width="1124" height="96" rx="14" fill="white" stroke="#c6d5dd"/><text x="60" y="379" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#166d75" font-weight="700">03</text><text x="114" y="380" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#142d3d" font-weight="700">Interpreted</text><text x="395" y="376" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#142d3d" font-weight="400">Does the explanation match your meaning?</text><text x="395" y="410" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435b69" font-weight="400">An explanation is still an unverified model output.</text><rect x="38" y="453" width="1124" height="96" rx="14" fill="white" stroke="#c6d5dd"/><text x="60" y="491" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#166d75" font-weight="700">04</text><text x="114" y="492" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#142d3d" font-weight="700">Observed behavior</text><text x="395" y="488" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#142d3d" font-weight="400">What happened in this particular check?</text><text x="395" y="522" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435b69" font-weight="400">One response does not establish future reliability.</text><rect x="38" y="565" width="1124" height="96" rx="14" fill="white" stroke="#c6d5dd"/><text x="60" y="603" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#166d75" font-weight="700">05</text><text x="114" y="604" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#142d3d" font-weight="700">Host enforced</text><text x="395" y="600" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#142d3d" font-weight="400">What does the product actually block?</text><text x="395" y="634" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#435b69" font-weight="400">Verify the control outside the model’s assertions.</text></svg>