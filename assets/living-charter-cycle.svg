<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Stable principles and responsive practice</title><desc id="desc">A separate Core Safeguards boundary is the non-waivable rights and safety floor. At the center, enduring user-confirmed values and priorities carry across situations and guide interpretation and review. Around them, a loop moves from situation to interpretation to response to review and the next situation. Routine feedback checks application, not automatic revision of the center. A separate dashed panel identifies explicit human review and decision, following the formal lifecycle where required, as the route for amending the center.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#176e76"/></marker></defs><rect x="20" y="20" width="1160" height="860" rx="20" fill="#f5f8fa" stroke="#51798f" stroke-width="4"/><text x="52" y="66" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#142d3d" font-weight="700">Core Safeguards</text><text x="358" y="66" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#142d3d" font-weight="400">Non-waivable rights and safety floor</text><path d="M 790 194 C 942 194 995 236 995 292" fill="none" stroke="#176e76" stroke-width="4" marker-end="url(#arrow)"/><path d="M 995 479 C 995 557 904 575 817 575" fill="none" stroke="#176e76" stroke-width="4" marker-end="url(#arrow)"/><path d="M 384 575 C 264 575 205 524 205 479" fill="none" stroke="#176e76" stroke-width="4" marker-end="url(#arrow)"/><path d="M 205 292 C 205 230 281 194 397 194" fill="none" stroke="#176e76" stroke-width="4" marker-end="url(#arrow)"/><rect x="410" y="135" width="380" height="115" rx="20" fill="#ffffff" stroke="#9cb9c5" stroke-width="2"/><text x="600.0" y="177" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#142d3d" font-weight="700">Situation</text><text x="600.0" y="214" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#142d3d" font-weight="400">What differs here?</text><rect x="860" y="310" width="270" height="155" rx="20" fill="#ffffff" stroke="#9cb9c5" stroke-width="2"/><text x="995.0" y="352" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#142d3d" font-weight="700">Interpretation</text><text x="995.0" y="389" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#142d3d" font-weight="400">Apply principles</text><text x="995.0" y="420" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#142d3d" font-weight="400">Weigh trade-offs</text><rect x="400" y="510" width="400" height="135" rx="20" fill="#ffffff" stroke="#9cb9c5" stroke-width="2"/><text x="600.0" y="552" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#142d3d" font-weight="700">Response</text><text x="600.0" y="589" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#142d3d" font-weight="400">Adapt expression,</text><text x="600.0" y="620" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#142d3d" font-weight="400">action, or pause</text><rect x="70" y="310" width="270" height="155" rx="20" fill="#ffffff" stroke="#9cb9c5" stroke-width="2"/><text x="205.0" y="352" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#142d3d" font-weight="700">Review</text><text x="205.0" y="389" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#142d3d" font-weight="400">Check against</text><text x="205.0" y="420" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#142d3d" font-weight="400">the same principles</text><rect x="370" y="288" width="460" height="188" rx="20" fill="#123e4a" stroke="#123e4a" stroke-width="2"/><text x="600" y="331" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#ffffff" font-weight="700">Enduring values</text><text x="600" y="369" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#ffffff" font-weight="700">and priorities</text><text x="600" y="411" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#ffffff" font-weight="400">Carry across situations</text><text x="600" y="451" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#d2e8e9" font-weight="400">Guide interpretation and review</text><text x="600" y="672" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#142d3d" font-weight="400">Routine feedback checks application; it does not rewrite the center.</text><rect x="70" y="710" width="1060" height="125" rx="20" fill="#ffffff" stroke="#7d6a47" stroke-width="2.5" stroke-dasharray="10 7"/><text x="95" y="750" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#142d3d" font-weight="700">To amend the center</text><text x="440" y="750" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#142d3d" font-weight="400">Explicit human review and decision</text><text x="95" y="794" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#142d3d" font-weight="400">Separate from routine feedback; formal lifecycle where required.</text></svg>